[package]
name = "recomp-net-server"
version = "0.1.0"
edition = "2021"
description = "Open-source lobby / signaling server for recomp-net hosts."
publish = false
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros", "ws"] }
axum-prometheus = "0.10"
base64 = "0.22"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = "9"
metrics = "0.24"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
    "chrono",
    "uuid",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
socket2 = "0.6.5"
nix = { version = "0.31.3", features = ["socket", "uio", "net"] }
libc = "0.2"
